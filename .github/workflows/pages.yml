# Publishes the demo site (the ViRaSPA-Extensions/ folder) to GitHub Pages.
# Pages must be set to "GitHub Actions" as its source (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ViRaSPA-Extensions
      - id: deployment
        uses: actions/deploy-pages@v4
