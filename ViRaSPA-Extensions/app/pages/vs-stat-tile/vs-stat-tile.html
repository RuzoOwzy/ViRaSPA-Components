<h1>vs-stat-tile</h1>
<p>A key figure for dashboards: a label, a big value, an optional icon and a trend. <a href="https://github.com/RuzoOwzy/ViRaSPA-Extensions/blob/main/ViRaSPA-Extensions/components/vs-stat-tile/README.md" rel="external">Documentation</a></p>

<div class="demo-grid">
  <vs-stat-tile label="Sales Today" value="TZS 1,250,000" icon="lucide:banknote" trend="up" trend-text="+12% vs yesterday"></vs-stat-tile>
