<h1>vs-countdown</h1>
<p class="demo-muted">Counts down to a moment or for a number of seconds, then shows its finished text.</p>
<div class="demo-box">
  <p>Offer ends in <vs-countdown seconds="125" finished-text="Offer ended"></vs-countdown></p>
  <p>This page closes in <vs-countdown seconds="10" finished-text="(not really)"></vs-countdown></p>
</div>

<code class="demo-code">&lt;vs-countdown seconds="125" finished-text="Offer ended" /&gt;
&lt;vs-countdown until="2026-12-31T23:59:59" /&gt;</code>
