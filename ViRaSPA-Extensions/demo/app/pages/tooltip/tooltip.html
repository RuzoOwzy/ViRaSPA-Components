<h1>tooltip</h1>
<p class="demo-muted">Plain-text tooltips from a <code>data-tooltip</code> attribute, shown on hover, keyboard focus and a long press. For rich content, use <a href="vs-tooltip">vs-tooltip</a>.</p>
<div class="demo-box demo-row">
  <button type="button" data-tooltip="Save (Ctrl+S)">Save</button>
  <button type="button" data-tooltip="Shown on hover, keyboard focus and a long press" data-tooltip-placement="bottom">Hover or focus me</button>
  <span tabindex="0" data-tooltip="Due in 3 days" data-tooltip-placement="right">Invoice 1042</span>
</div>

<code class="demo-code">&lt;button data-tooltip="Save (Ctrl+S)"&gt;Save&lt;/button&gt;</code>
