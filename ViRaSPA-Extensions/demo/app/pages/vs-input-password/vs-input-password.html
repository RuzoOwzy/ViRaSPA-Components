<h1>vs-input-password</h1>
<p class="demo-muted">Show or hide the password, a warning while Caps Lock is on, and a strength meter. Password managers recognise it like a native field.</p>
<form class="demo-box demo-form" id="d-form">
  <div class="demo-field"><label for="d-password">New password</label>
    <vs-input-password id="d-password" name="password" autocomplete="new-password" minlength="8" strength required></vs-input-password></div>
</form>
